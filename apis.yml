aid: super-coffee
name: Super Coffee
description: 'Super Coffee is the ready-to-drink coffee brand operated by Kitu Life,
  Inc., founded in 2015 by brothers Jordan, Jake and Jim DeCicco and distributed across
  tens of thousands of US retail locations alongside a direct-to-consumer online store
  at drinksupercoffee.com. The company is not a software vendor and publishes no developer
  program, but its Shopify-hosted storefront exposes a real, anonymous, machine-readable
  agent commerce surface: an /llms.txt and /agents.md agent instruction set, a Universal
  Commerce Protocol (UCP) merchant profile at /.well-known/ucp, a live MCP endpoint at
  /api/ucp/mcp serving 13 catalog, cart, checkout and order tools with full JSON Schema
  inputs, and OAuth 2.0 / OpenID Connect discovery documents for Shopify customer
  accounts. Checkout is explicitly gated on contemporaneous human approval.'
