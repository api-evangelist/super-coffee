apis:
- aid: super-coffee-ucp-mcp
  name: Super Coffee UCP Commerce MCP
  description: 'The Universal Commerce Protocol (UCP) shopping service that Super Coffee''s
    storefront implements over MCP transport. An anonymous tools/list returns 13 tools
    covering catalog search and lookup, product detail, cart create/read/update/cancel,
    checkout create/read/update/complete/cancel, and order retrieval, each carrying a
    full JSON Schema draft 2020-12 inputSchema. Payment completion requires explicit
    contemporaneous buyer approval; the endpoint is rate limited per IP.'
